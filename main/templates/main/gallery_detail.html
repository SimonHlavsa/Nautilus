{% extends "main/base.html" %}
{% load static %}

{% block extra_head %}
<link rel="stylesheet" href="{% static 'main/css/gallery_detail.css' %}">
{% endblock extra_head %}

{% block content %}
<h1 class="text-center">Galerie</h1>
<div class="photos">
    {% for image in images %}
        <div class="photo">
            <img src="{{ image.high_res_link }}" alt="{{ image.name }}">
        </div>
    {% endfor %}
</div>
{% endblock %}
